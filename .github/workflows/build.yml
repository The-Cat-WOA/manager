
    
  
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Fest auf Ubuntu 24.04 setzen, damit sich das Build-System nicht unerwartet ändert.
    runs-on: ubuntu-24.04

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Projekt-ZIP entpacken und Projektordner finden
        shell: bash
        run: |
          ZIP_FILE=""
          if [ -f WoA_App_korrigiert.zip ]; then
            ZIP_FILE="WoA_App_korrigiert.zip"
          elif [ -f WoA_App.zip ]; then
            ZIP_FILE="WoA_App.zip"
          fi

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p proj
            unzip -o "$ZIP_FILE" -d proj
          fi

          SETTINGS_FILE=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -not -path '*/.gradle/*' | sort | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEHLER: settings.gradle(.kts) wurde nicht gefunden."
            echo "Prüfe, ob WoA_App_korrigiert.zip oder WoA_App.zip im Repository-Root liegt."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android-Projekt gefunden: $PROJECT_DIR"
          echo "PROJ=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Benötigte Android-SDK-Version installieren
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: APK bauen
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Prüfen, ob die APK erstellt wurde
        shell: bash
        run: |
          APK="$PROJ/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FEHLER: app-debug.apk wurde nicht gefunden."
            find "$PROJ" -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "APK erfolgreich erstellt: $APK"

      - name: APK als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Bot-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build-Log bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Build-Logs
          path: |
            gradle-build.log
            ${{ env.PROJ }}/app/build/reports/
          if-no-files-found: warn

