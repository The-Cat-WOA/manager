
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Projekt-ZIP entpacken
        run: |
          if [ -f WoA_App.zip ]; then
            mkdir -p proj
            unzip -o WoA_App.zip -d proj
          fi

          D=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1 | xargs -r dirname)

          if [ -z "$D" ]; then
            echo "FEHLER: Keine settings.gradle.kts gefunden!"
            exit 1
          fi

          echo "Projektordner: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: APK bauen
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Bot-APK
          path: "**/app-debug.apk"
          if-no-files-found: error
