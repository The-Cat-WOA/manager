name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android-Projekt entpacken und AndroidX aktivieren
        shell: bash
        run: |
          mkdir -p proj
          unzip -o WoA_App.zip -d proj
          PROJECT_DIR="$(find proj -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android-Projekt nicht gefunden"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -q '^android.useAndroidX=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^android.enableJetifier=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK Pakete installieren
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: APK prüfen
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK nicht gefunden"; exit 1; }
          ls -lh "$APK"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Bot-APK
          path: \u0024{{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
