name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android-Projekt finden und entpacken
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for candidate in "WoA_App.zip" "WoA_App(2).zip"; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "::error::Bitte WoA_App.zip oder WoA_App(2).zip ins Hauptverzeichnis hochladen."
            exit 1
          fi
          mkdir -p proj
          unzip -o "$ZIP" -d proj
          PROJECT_DIR="$(find proj -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts wurde im ZIP nicht gefunden."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -q '^android.useAndroidX=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^android.enableJetifier=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK Pakete installieren
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: APK prüfen
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK nicht gefunden"; exit 1; }
          ls -lh "$APK"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Bot-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WoA-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
